<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
        name="csrf-token"
        content="{{ csrf_token() }}"
    >
    <title>
        SENTINEL-X | Vérification faciale
    </title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #edf3fa;
            background:
                radial-gradient(circle at top right, #142743, #070b12 45%);
        }

        .verification-card {
            width: min(720px, 100%);
            padding: 30px;
            background: rgba(14, 21, 32, .97);
            border: 1px solid #233247;
            border-radius: 18px;
        }

        .eyebrow {
            color: #558fff;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 { margin: 8px 0; font-size: 26px; }
        .subtitle { margin: 0 0 22px; color: #8a9ab0; }

        .camera {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            background: #05080d;
            border: 1px solid #29384d;
            border-radius: 13px;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .target {
            width: 38%;
            height: 72%;
            position: absolute;
            top: 14%;
            left: 31%;
            border: 2px solid #4d8dff;
            border-radius: 48%;
            box-shadow: 0 0 0 999px rgba(0, 0, 0, .18);
        }

        .status {
            margin-top: 18px;
            padding: 13px;
            color: #9fb5d0;
            background: #0a131f;
            border-radius: 8px;
            text-align: center;
        }

        .status.success { color: #57e5a3; }
        .status.error { color: #ff7c84; }

        .cancel {
            display: block;
            margin-top: 18px;
            color: #80adff;
            text-align: center;
            text-decoration: none;
        }

        canvas { display: none; }
    </style>
</head>

<body>

<main class="verification-card">
    <div class="eyebrow">
        SENTINEL-X · SECOND FACTEUR
    </div>

    <h1>
        Vérification faciale
    </h1>

    <p class="subtitle">
        Bonjour
        {{ utilisateur.first_name or utilisateur.username }}.
        Regardez la caméra et placez votre visage dans le cadre.
    </p>

    <div class="camera">
        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>
        <div class="target"></div>
    </div>

    <canvas id="capture"></canvas>

    <div
        id="status"
        class="status"
    >
        Initialisation de la caméra…
    </div>

    <a
        class="cancel"
        href="{{ url_for('login') }}"
    >
        Annuler et revenir au login
    </a>
</main>

<script>
    const video =
        document.getElementById("camera");
    const canvas =
        document.getElementById("capture");
    const statusBox =
        document.getElementById("status");
    const csrfToken =
        document
            .querySelector('meta[name="csrf-token"]')
            .content;

    let stopped = false;

    function setStatus(message, type = "") {
        statusBox.textContent = message;
        statusBox.className =
            "status" + (type ? " " + type : "");
    }

    function captureBlob() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas
            .getContext("2d")
            .drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

        return new Promise(resolve => {
            canvas.toBlob(
                resolve,
                "image/jpeg",
                0.88
            );
        });
    }

    async function verify() {
        if (stopped) return;

        try {
            const blob = await captureBlob();
            const form = new FormData();
            form.append(
                "image",
                blob,
                "capture.jpg"
            );

            const response = await fetch(
                "{{ url_for('face_verify_api') }}",
                {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": csrfToken
                    },
                    body: form
                }
            );

            const data = await response.json();

            if (data.success) {
                stopped = true;
                setStatus(
                    "Identité confirmée. Ouverture…",
                    "success"
                );
                window.location.href = data.redirect;
                return;
            }

            if (
                data.blocked
                || data.expired
            ) {
                stopped = true;
                setStatus(
                    data.message,
                    "error"
                );
                setTimeout(
                    () => {
                        window.location.href =
                            data.redirect;
                    },
                    1800
                );
                return;
            }

            setStatus(
                data.message,
                data.matched ? "success" : ""
            );
        } catch (error) {
            setStatus(
                "Connexion au serveur impossible.",
                "error"
            );
        }

        setTimeout(
            verify,
            1000
        );
    }

    async function startCamera() {
        try {
            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: {
                            facingMode: "user",
                            width: { ideal: 960 },
                            height: { ideal: 540 }
                        },
                        audio: false
                    });

            video.srcObject = stream;

            await new Promise(resolve => {
                video.onloadedmetadata = resolve;
            });

            setStatus(
                "Analyse du visage en cours…"
            );

            setTimeout(
                verify,
                800
            );
        } catch (error) {
            setStatus(
                "Autorisez l’accès à la caméra pour continuer.",
                "error"
            );
        }
    }

    startCamera();
</script>

</body>

</html>
